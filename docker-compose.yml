services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: platform
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  platform:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/platform?sslmode=disable
      BIND_ADDR: 0.0.0.0:3000
      RUST_LOG: info,sqlx=warn
      GLOBAL_MAX_CONCURRENCY: 32
      PER_TENANT_MAX_CONCURRENCY: 8
      RUN_MIGRATIONS: "true"
    ports:
      - "3000:3000"
